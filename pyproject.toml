[project]
name = "nfl-fantasy-platform"
version = "0.1.0"
description = "NFL fantasy-football data platform: nflreadpy ingestion + dbt (DuckDB dev/ci, Postgres prod)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "nflreadpy>=0.1",
    "polars>=1.0",
    "duckdb>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Prod loader (Iceberg/Spark are gone; prod is plain Postgres)
load = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]
dbt = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "dbt-postgres>=1.8",
    "sqlfluff>=3.0",
    "sqlfluff-templater-dbt>=3.0",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N812", "N806"]

[tool.ruff.lint.per-file-ignores]
# Embeds the draft board's CSS/JS/HTML as string constants. A 100-char Python limit is
# meaningless inside a stylesheet, and rewrapping would change the emitted markup.
"scripts/build_draft_board.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "nflreadpy",
    "nflreadpy.*",
    "polars",
    "polars.*",
    "duckdb",
    "duckdb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "k3s: requires the self-hosted k3s cluster (prod). Skipped in CI with -m 'not k3s'.",
]
