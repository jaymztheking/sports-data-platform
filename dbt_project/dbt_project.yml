name: 'nfl'
version: '1.0.0'
config-version: 2

# profiles.yml lives alongside this file; invoke with --profiles-dir dbt_project
profile: 'nfl'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Games a player must have logged before he is ranked in fct_player_season. Ranking on
  # per-game points with no floor lets a one-game sample top the board.
  min_games_for_rank: 6
  # Overall consensus rank past which nobody is actually drafted. A 12-team league takes
  # ~180 players, so value_over_ecr beyond this is comparing noise to noise: the board
  # does not rank WR162 carefully, so any player who merely suited up scores huge there.
  draftable_ecr_cutoff: 200

# Layer materializations (the medallion spine). Every model carries the `nfl` tag.
models:
  nfl:
    +tags: ["nfl"]
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
